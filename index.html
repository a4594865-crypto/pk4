<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連線至 【TW】ＣＳ 同 學 會 １ v １ - D</title>
    <link rel="preconnect" href="https://c2t.ddns.net:81" crossorigin>
    <script>
        window.__statusTasks = (function () {
            const base = "https://c2t.ddns.net:81";
            const check = (port) => {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 1500);
                return fetch(`${base}/status_${port}.json?t=${Date.now()}`, { signal: ctrl.signal, cache: "no-store" })
                    .then(res => res.ok ? res.json() : null)
                    .then(data => {
                        if (!data) return false;
                        const players = String(data.players ?? "").trim();
                        const map = String(data.map ?? "").trim().toUpperCase();
                        return /^\d+\s*\/\s*[1-9]\d*$/.test(players) && map !== "OFFLINE";
                    })
                    .catch(() => false)
                    .finally(() => clearTimeout(timer));
            };
            return { c: check(27125), d: check(27225) };
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Oswald:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', Arial, sans-serif; margin: 0; padding: 16px; background: #020406; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; overflow-x: hidden; }
        .background { position: fixed; inset: 0; background-image: url('https://lh3.googleusercontent.com/d/1ScywmwrQA7nWDgIwVWpivfxVYd2MoJiy'); background-size: cover; background-position: center; filter: brightness(.5) blur(4px); z-index: -1; }
        .container { position: relative; background: rgba(0, 0, 0, .9); padding: 40px 24px; border-radius: 8px; box-shadow: 0 20px 50px rgba(0, 0, 0, .8); text-align: center; width: 100%; max-width: 650px; box-sizing: border-box; border: 1px solid rgba(255, 255, 255, .1); }
        h1 { font-family: 'Oswald', 'Noto Sans TC', sans-serif; font-size: 2.2em; margin: 0 0 20px 0; color: #4da6ff; letter-spacing: 2px; text-transform: uppercase; }
        p { font-size: 1.15em; color: #aaa; margin: 0 0 30px 0; line-height: 1.6; min-height: 3.2em; }
        .button-group { display: grid; grid-template-columns: 1fr; gap: 14px; margin: 20px auto 0 auto; width: 100%; max-width: 260px; }
        .manual-link { display: block; width: 100%; box-sizing: border-box; padding: 13px 0; font-size: 16px; background-color: #4da6ff; color: #fff; text-decoration: none; border-radius: 4px; font-weight: 700; transition: background-color .2s ease, transform .2s ease, box-shadow .2s ease; white-space: nowrap; text-align: center; }
        .manual-link:hover { background-color: #a63a23; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(166, 58, 35, .3); }
        .manual-link:active { background-color: #7a2a19; }
        .manual-link.secondary { background-color: #FF5733; }
        .manual-link.secondary:hover { background-color: #1a7bb9; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(26, 123, 185, .3); }
        .manual-link.secondary:active { background-color: #104f77; }
        .manual-link.third { background-color: #28a745; }
        .manual-link.third:hover { background-color: #1e7e34; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(40, 167, 69, .3); }
        .manual-link.third:active { background-color: #155724; }
        .manual-link.fourth { background-color: #8b5cf6; }
        .manual-link.fourth:hover { background-color: #6d28d9; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(139, 92, 246, .3); }
        .manual-link.fourth:active { background-color: #5b21b6; }
        .manual-link.disabled { background-color: #555 !important; color: #999 !important; cursor: not-allowed !important; pointer-events: none; box-shadow: none !important; transform: none !important; }
        .manual-link.pending { visibility: hidden; pointer-events: none; transition: none !important; }
        .loader { width: 240px; height: 4px; background: rgba(255, 255, 255, .1); border-radius: 2px; margin: 0 auto 30px auto; position: relative; overflow: hidden; }
        .loader::after { content: ''; position: absolute; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, #4da6ff, transparent); animation: slide-progress 2s ease-in-out infinite; }
        .loader.stopped::after { animation: none; left: 0; background: rgba(255, 87, 51, .45); }
        @keyframes slide-progress { from { left: -100%; } to { left: 100%; } }
        .cs2-red, .text-red { color: #FF5733; font-weight: 900; }
        @media (min-width: 520px) {
            .button-group { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 440px; gap: 18px; }
        }
        @media (min-width: 760px) {
            .container { max-width: 855px; padding: 64px 44px; border-radius: 11px; }
            h1 { font-size: 3.1em; margin-bottom: 27px; }
            p { font-size: 1.55em; margin-bottom: 40px; }
            .button-group { max-width: 560px; gap: 24px; margin-top: 27px; }
            .manual-link { padding: 17px 0; font-size: 20px; border-radius: 6px; }
            .loader { width: 320px; height: 5px; margin: 0 auto 40px auto; }
        }
        @media (min-width: 1000px) {
            .container { max-width: 1000px; padding: 80px 60px; border-radius: 16px; }
            h1 { font-size: 3.5em; margin-bottom: 40px; }
            p { font-size: 2.1em; margin-bottom: 52px; }
            .button-group { max-width: 680px; gap: 28px; margin-top: 36px; }
            .manual-link { padding: 22px 0; font-size: 24px; border-radius: 8px; }
            .loader { width: 480px; height: 8px; margin: 0 auto 52px auto; }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <h1 id="page-title">正連線至 <span class="text-red">１ v １ - D</span> 伺 服 器</h1>
        <div class="loader" id="loader"></div>
        <p id="status-text"></p>
        <div class="button-group" id="button-group"></div>
    </div>

    <script>
        (async function () {
            const TARGET_SERVER = "d";
            const SERVER_IP = "114.34.29.54";
            const COUNTDOWN_SECONDS = 2;

            const SERVERS = {
                a: { key: "a", titleLabel: "１ v １ - A", descLabel: "１ v １ - A 服 (27018)", btnLabel: "1 v 1-A (27018)", port: 27018, alwaysOnline: true },
                b: { key: "b", titleLabel: "１ v １ - B", descLabel: "１ v １ - B 服 (27019)", btnLabel: "1 v 1-B (27019)", port: 27019, alwaysOnline: true },
                c: { key: "c", titleLabel: "１ v １ - C", descLabel: "１ v １ - C 服 (27125)", btnLabel: "1 v 1-C (27125)", closedBtnLabel: "1 v 1-C (未 開)", port: 27125, alwaysOnline: false },
                d: { key: "d", titleLabel: "１ v １ - D", descLabel: "１ v １ - D 服 (27225)", btnLabel: "1 v 1-D (27225)", closedBtnLabel: "1 v 1-D (未 開)", port: 27225, alwaysOnline: false }
            };

            const BUTTON_ORDER = {
                a: ["a", "b", "c", "d"],
                b: ["b", "a", "c", "d"],
                c: ["c", "a", "b", "d"],
                d: ["d", "a", "b", "c"]
            };

            const getSteamUrl = (port) => `steam://run/730//+connect ${SERVER_IP}:${port}`;
            const delay = (ms) => new Promise(r => setTimeout(r, ms));
            const tasks = window.__statusTasks;
            const resolved = { a: true, b: true, c: null, d: null };

            const target = SERVERS[TARGET_SERVER] || SERVERS.a;
            const titleEl = document.getElementById("page-title");
            const loaderEl = document.getElementById("loader");
            const statusEl = document.getElementById("status-text");
            const btnGroupEl = document.getElementById("button-group");

            let countdownTimer = null;
            let userClickedManual = false;
            let buttonsRevealed = false;

            const stopCountdown = () => {
                if (countdownTimer !== null) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }
            };

            const startCountdown = () => {
                let remaining = COUNTDOWN_SECONDS;
                const renderCountdown = () => {
                    statusEl.innerHTML =
                        `正在準備連線到伺服器，請稍候<br><br>` +
                        `系統將於 <span class="text-red">${remaining}</span> 秒後自動連線 ` +
                        `<span class="cs2-red">${target.descLabel}</span>`;
                };

                renderCountdown();
                countdownTimer = setInterval(() => {
                    remaining -= 1;
                    if (remaining > 0) {
                        renderCountdown();
                    } else {
                        stopCountdown();
                        statusEl.innerHTML =
                            `已送出連線指令至 <span class="cs2-red">${target.descLabel}</span><br><br>` +
                            `若遊戲未自動開啟，請點擊下方按鈕手動連線`;
                        window.location.href = getSteamUrl(target.port);
                    }
                }, 1000);
            };

            const order = BUTTON_ORDER[target.key] || ["a", "b", "c", "d"];
            const styleClasses = ["manual-link secondary", "manual-link", "manual-link third", "manual-link fourth"];
            const btnRefs = {};

            const revealButton = (key, isOnline) => {
                const srv = SERVERS[key];
                const link = btnRefs[key];
                if (!link || isOnline === null) return;

                if (isOnline) {
                    link.classList.remove("disabled");
                    link.href = getSteamUrl(srv.port);
                    link.textContent = srv.btnLabel;
                } else {
                    link.classList.add("disabled");
                    link.removeAttribute("href");
                    link.textContent = srv.closedBtnLabel || srv.btnLabel;
                }
                link.classList.remove("pending");
            };

            order.forEach((key, index) => {
                const srv = SERVERS[key];
                const link = document.createElement("a");
                link.className = `${styleClasses[index] || "manual-link"} pending`;
                link.textContent = srv.btnLabel;
                link.addEventListener("click", () => {
                    if (link.classList.contains("disabled") || link.classList.contains("pending")) return;
                    userClickedManual = true;
                    stopCountdown();
                    titleEl.innerHTML = `正連線至 <span class="text-red">${srv.titleLabel}</span> 伺 服 器`;
                    statusEl.innerHTML = `已送出連線指令至 <span class="cs2-red">${srv.descLabel}</span><br><br>若遊戲未自動開啟，請再點一次下方按鈕`;
                    loaderEl.classList.remove("stopped");
                });
                btnGroupEl.appendChild(link);
                btnRefs[key] = link;
            });

            tasks.c.then(val => { resolved.c = val; if (buttonsRevealed) revealButton("c", val); });
            tasks.d.then(val => { resolved.d = val; if (buttonsRevealed) revealButton("d", val); });

            const revealAllButtons = Promise.race([Promise.all([tasks.c, tasks.d]), delay(250)]).then(() => {
                buttonsRevealed = true;
                order.forEach(key => {
                    if (resolved[key] !== null) revealButton(key, resolved[key]);
                });
            });

            if (target.alwaysOnline) {
                startCountdown();
                await revealAllButtons;
                return;
            }

            const hintTimer = setTimeout(() => {
                if (!userClickedManual) statusEl.textContent = "正在確認伺服器狀態，請稍候...";
            }, 150);

            const isTargetOnline = await tasks[target.key];
            clearTimeout(hintTimer);

            if (userClickedManual) return;

            if (!isTargetOnline) {
                titleEl.innerHTML = `<span class="text-red">${target.titleLabel}</span> 目 前 未 開 放`;
                loaderEl.classList.add("stopped");
                statusEl.innerHTML = '目前伺服器尚未開啟或維護中<br><br>請點選下方按鈕改連其他伺服器';
                return;
            }

            startCountdown();
        })();
    </script>
</body>
</html>
